[project]
name = "ehri-skgif"
version = "0.1.0"
description = "SKG-IF demo service exposing EHRI Document Blog posts as research products linked to archival record sets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
]

[project.scripts]
ehri-skgif = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ehri_skgif"]
